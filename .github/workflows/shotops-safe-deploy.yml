name: ShotOps Safe Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  safe-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - name: Install dependencies
        run: if [ -f go.mod ]; then go mod download; fi
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./...
      - name: Trigger ShotOps Deployment
        if: success()
        env:
          SHOTOPS_DEPLOY_WEBHOOK: ${{ secrets.SHOTOPS_DEPLOY_WEBHOOK }}
          SHOTOPS_DEPLOY_TOKEN: ${{ secrets.SHOTOPS_DEPLOY_TOKEN }}
        run: |
          curl --fail --request POST "$SHOTOPS_DEPLOY_WEBHOOK" \
            --header "Authorization: Bearer $SHOTOPS_DEPLOY_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{
              "commit": "${{ github.sha }}",
              "branch": "${{ github.ref_name }}",
              "repository": "${{ github.repository }}",
              "run_id": "${{ github.run_id }}",
              "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }'
